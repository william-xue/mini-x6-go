<!doctype html>
<html lang="zh-CN">
  <head>

    <title>mini-x6-go · 第 2 课</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f4f6fa; }
      main { width: min(900px, calc(100% - 32px)); margin: 48px auto; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      h1 { margin: 0; font-size: 24px; }
      p { margin: 4px 0 0; color: #64708a; }
      button { padding: 9px 16px; border: 0; border-radius: 6px; color: white; background: #315fcf; cursor: pointer; }
      #graph { overflow: hidden; border: 1px solid #d9deea; border-radius: 10px; background: white; }
      svg { display: block; max-width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>第 2 课：端口</h1>
          <p>橙色圆点是端口；连线连接端口中心，不再连接节点中心。</p>
        </div>
        <button id="move-a" type="button">移动 A</button>
      </header>
      <div id="graph"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
