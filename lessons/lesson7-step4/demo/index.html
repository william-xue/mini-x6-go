<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>mini-x6-go · 第 7.4 课</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f4f6fa; }
      main { width: min(900px, calc(100% - 32px)); margin: 48px auto; }
      h1 { margin: 0; font-size: 24px; }
      p { margin: 4px 0 16px; color: #64708a; }
      #tools { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      button { padding: 8px 14px; border: 1px solid #cbd3e3; border-radius: 6px; background: white; cursor: pointer; }
      #status { margin-left: auto; color: #64708a; }
      #designer { overflow: hidden; border: 1px solid #d9deea; border-radius: 10px; background: white; }
      svg { display: block; max-width: 100%; outline: none; cursor: crosshair; }
    </style>
  </head>
  <body>
    <main>
      <h1>第 7.4 课：贝塞尔曲线轮廓吸附</h1>
      <p>紫色虚线是真实 snap path。浏览器沿曲线采样，再用 7.3 的最近线段算法放置引脚。</p>
      <div id="tools">
        <button id="pin-tool">放置引脚</button>
        <button id="select-tool">停止放置</button>
        <label>采样间隔 <input id="step" type="range" min="2" max="24" value="6" /> </label>
        <span id="status"></span>
      </div>
      <div id="designer"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
