<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>mini-x6-go · 第 13.2 课</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f4f6fa; }
      main { width: min(920px, calc(100% - 32px)); margin: 40px auto; }
      h1 { margin: 0; font-size: 24px; }
      h2 { margin: 22px 0 8px; font-size: 16px; }
      p { margin: 4px 0 12px; color: #64708a; }
      #tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      button { padding: 8px 14px; border: 1px solid #cbd3e3; border-radius: 6px; background: white; cursor: pointer; }
      button[aria-pressed='true'] { background: #eef3ff; border-color: #315fcf; }
      #status { margin-left: auto; color: #64708a; font-size: 14px; }
      #designer { overflow: hidden; border: 1px solid #d9deea; border-radius: 10px; background: white; }
      svg { display: block; max-width: 100%; outline: none; }
      #pins { margin: 0; padding: 12px 14px; border: 1px solid #d9deea; border-radius: 10px; background: #0f172a; color: #d7e0f4; font: 12px/1.7 ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>第 13.2 课：引脚的加、删、拖</h1>
      <p>把鼠标移到元件轮廓上会先出现一个虚线预览圈；点一下才真正生成。悬停在已有引脚上会冒出红色 ×，点它删除。按住引脚可以沿轮廓滑动。</p>

      <div id="tools"></div>
      <div id="designer"></div>

      <h2>引脚列表</h2>
      <pre id="pins"></pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
